plugins {
    id 'com.diffplug.spotless' version '8.10.4'
}

repositories {
    mavenCentral()
}

def repository = rootDir

spotless {
    java {
        target fileTree(repository) {
            include 'android/app/src/**/*.java', 'tools/**/*.java'
            exclude '**/build/**', '**/node_modules/**', 'tools/phase6/Hierarchy.java'
        }
        googleJavaFormat('1.28.0')
        importOrder('java', 'javax', 'android', '', 'name.roqia', '\\#')
        trimTrailingWhitespace()
        endWithNewline()
    }
    kotlin {
        target fileTree(repository) {
            include 'android/app/src/**/*.kt', 'tools/**/*.kt'
            exclude '**/build/**', '**/node_modules/**'
        }
        ktlint('1.8.0')
    }
    kotlinGradle {
        target fileTree(repository) {
            include 'android/**/*.gradle.kts', '*.gradle.kts'
            exclude '**/build/**', '**/.gradle/**'
        }
        ktlint('1.8.0')
    }
    groovyGradle {
        target fileTree(repository) {
            include 'android/*.gradle', 'android/app/*.gradle', '*.gradle'
        }
        // Use the university mirror while Eclipse's download/archive hosts are unavailable.
        greclipse('4.35').withP2Mirrors([
            'https://download.eclipse.org/eclipse/updates/4.35/': 'https://ftp.fau.de/eclipse/eclipse/updates/4.35/',
            'https://groovy.jfrog.io/': 'https://groovy.jfrog.io/'
        ])
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
}
