name: Code quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/quality/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install application dependencies and reviewed native patches
        run: yarn install --frozen-lockfile
      - name: Install Python and Objective-C style tools
        run: yarn quality:setup
      - name: Lint JavaScript, TypeScript and Python
        run: yarn lint:js && yarn lint:python
      - name: Check source formatting and TypeScript
        run: yarn format:check && yarn typecheck
      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v1-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/gradle.properties', 'package-lock.json', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v1-
      - name: Check Java, Kotlin and Gradle style
        run: node tools/quality/native.cjs check jvm
      - name: Check Objective-C style
        run: node tools/quality/native.cjs check objc
      - name: Run domain and UI regression tests
        run: yarn test:regression
      - name: Run portable Python and native regression tests
        run: |
          python3 -m unittest discover -s tools/feasibility -p 'test_*.py'
          python3 -m unittest discover -s tools/phase10 -p 'test_*.py'
          PYTHONPATH=tools/phase11 python3 -m unittest test_patch test_sleep_native test_font_shaping
          python3 -m unittest discover -s tools/phase12 -p 'test_*.py'
      - name: Cache web npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-web-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-web-npm-
      - name: Install and build web app
        working-directory: web
        run: npm ci && npm run build

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Check Swift style with the Xcode toolchain
        run: node tools/quality/native.cjs check swift
