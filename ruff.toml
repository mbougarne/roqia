target-version = "py311"
line-length = 88
include = ["tools/**/*.py"]
extend-exclude = [
    "tools/**/android-*.py",
    "tools/**/verify-android.py",
    "tools/feasibility/run-android-probe.py",
    "tools/phase6/build-ui-helper.py",
    "tools/phase12/build-gallery.py",
]

[lint]
select = ["E4", "E7", "E9", "F", "I"]
# Naming/lambda rewrites are outside this formatting baseline.
ignore = ["E731", "E741"]

[lint.per-file-ignores]
# These source importers intentionally load sibling tools after extending sys.path.
"tools/phase4/prepare.py" = ["E402"]
"tools/phase5/catalog.py" = ["E402"]

[format]
quote-style = "single"
