target-version = "py311"
line-length = 88
include = ["tools/**/*.py"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]
# Naming/lambda rewrites are outside this formatting baseline.
ignore = ["E731", "E741"]

[lint.per-file-ignores]
# These source importers intentionally load sibling tools after extending sys.path.
"tools/phase4/prepare.py" = ["E402"]
"tools/phase5/catalog.py" = ["E402"]
# This historical capture script injects android-visual.py's helpers with runpy.
"tools/phase12/android-journeys.py" = ["F821"]

[format]
quote-style = "single"
