<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>رقية</title>
    <script>
      // GitHub Pages SPA fallback: redirect unknown routes to index with encoded path.
      // segmentCount=0 for custom domain (root); use 1 for project pages like /username.github.io/repo.
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
          '/?p=/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
